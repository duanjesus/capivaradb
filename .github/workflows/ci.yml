name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: compat/pgx/go.sum

      - name: The core must not have dependencies
        shell: bash
        run: |
          modules="$(go list -m all)"
          echo "$modules"
          test "$(echo "$modules" | wc -l)" -eq 1

      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...

      - name: Fuzz the parser briefly
        if: runner.os == 'Linux'
        run: go test ./internal/sql -run XXX -fuzz FuzzParse -fuzztime 30s

      - name: Fuzz the B+tree briefly
        if: runner.os == 'Linux'
        run: go test ./internal/storage -run XXX -fuzz FuzzTree -fuzztime 30s

      - name: pgx driver tests
        working-directory: compat/pgx
        run: go test -count=1 ./...

  clients:
    name: psql and JDBC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: compat/pgx/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: JDBC smoke test
        run: bash scripts/jdbc-smoke.sh

      - name: psql smoke test
        run: bash scripts/psql-smoke.sh

      - name: Kill-and-recover test through psql
        run: bash scripts/restart-smoke.sh

  sqllogictest:
    name: sqllogictest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: compat/pgx/go.sum
      - name: Restore the downloaded scripts
        uses: actions/cache@v4
        with:
          path: .cache/slt
          key: slt-${{ hashFiles('scripts/slt.sh') }}

      - name: Run and compare with the baseline
        run: bash scripts/slt.sh

  mutation:
    name: mutation-test the crash, isolation and planner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: compat/pgx/go.sum
      - name: Break each durability, isolation and planner rule; the tests must fail
        run: bash scripts/mutation-test.sh
