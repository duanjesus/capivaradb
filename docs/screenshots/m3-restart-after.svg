<svg xmlns="http://www.w3.org/2000/svg" width="676" height="730" viewBox="0 0 676 730" role="img" aria-label="second server, same file">
<rect width="676" height="730" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h656 a10 10 0 0 1 10 10v24 h-676 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="338" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">second server, same file</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">## a new server opens the same file</text>
<text x="18" y="86" fill="#8b949e">-- Second server process, same file: everything is still there.</text>
<text x="18" y="106" fill="#e6edf3">select * from capivaras;</text>
<text x="18" y="126" fill="#e6edf3"> id |  name  | weight | wild</text>
<text x="18" y="146" fill="#8b949e">----+--------+--------+------</text>
<text x="18" y="166" fill="#e6edf3">  1 | Filó   |   48.5 | t</text>
<text x="18" y="186" fill="#e6edf3">  2 | Bolota |     61 | f</text>
<text x="18" y="206" fill="#e6edf3">  4 | Padrão |   45.5 | t</text>
<text x="18" y="226" fill="#e6edf3">(3 rows)</text>
<text x="18" y="266" fill="#8b949e">-- So are the rules: the primary key, the unique name, the defaults.</text>
<text x="18" y="286" fill="#e6edf3">insert into capivaras values (1, &#39;Outra&#39;, 1, true);</text>
<text x="18" y="306" fill="#ff7b72">ERROR:  duplicate key value violates unique constraint &#34;capivaras_pkey&#34;</text>
<text x="18" y="326" fill="#ffa198">DETAIL:  Key (id)=(1) already exists.</text>
<text x="18" y="346" fill="#e6edf3">insert into capivaras (id, name) values (5, &#39;Filó&#39;);</text>
<text x="18" y="366" fill="#ff7b72">ERROR:  duplicate key value violates unique constraint &#34;capivaras_name_key&#34;</text>
<text x="18" y="386" fill="#ffa198">DETAIL:  Key (name)=(Filó) already exists.</text>
<text x="18" y="406" fill="#e6edf3">insert into capivaras (id, name) values (5, &#39;Nova&#39;);</text>
<text x="18" y="426" fill="#e6edf3">INSERT 0 1</text>
<text x="18" y="446" fill="#e6edf3">select name, weight, wild from capivaras where id = 5;</text>
<text x="18" y="466" fill="#e6edf3"> name | weight | wild</text>
<text x="18" y="486" fill="#8b949e">------+--------+------</text>
<text x="18" y="506" fill="#e6edf3"> Nova |   45.5 | t</text>
<text x="18" y="526" fill="#e6edf3">(1 row)</text>
<text x="18" y="566" fill="#8b949e">-- The offline check above compared the index with the rows, entry by entry.</text>
<text x="18" y="586" fill="#8b949e">-- (Queries do not use indexes yet: choosing one is the planner&#39;s job.)</text>
<text x="18" y="606" fill="#e6edf3">select name from capivaras where weight &gt; 46 order by weight;</text>
<text x="18" y="626" fill="#e6edf3">  name</text>
<text x="18" y="646" fill="#8b949e">--------</text>
<text x="18" y="666" fill="#e6edf3"> Filó</text>
<text x="18" y="686" fill="#e6edf3"> Bolota</text>
<text x="18" y="706" fill="#e6edf3">(2 rows)</text>
</g>
</svg>
