<svg xmlns="http://www.w3.org/2000/svg" width="853" height="650" viewBox="0 0 853 650" role="img" aria-label="kill -9 mid-transaction, then recovery">
<rect width="853" height="650" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h833 a10 10 0 0 1 10 10v24 h-853 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="426" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">kill -9 mid-transaction, then recovery</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- A transaction left open: the server is killed while it is in progress.</text>
<text x="18" y="86" fill="#e6edf3">begin;</text>
<text x="18" y="106" fill="#e6edf3">BEGIN</text>
<text x="18" y="126" fill="#e6edf3">insert into capivaras (id, name) values (99, &#39;Fantasma&#39;);</text>
<text x="18" y="146" fill="#e6edf3">INSERT 0 1</text>
<text x="18" y="166" fill="#e6edf3">update capivaras set weight = 0;</text>
<text x="18" y="186" fill="#e6edf3">UPDATE 4</text>
<text x="18" y="206" fill="#e6edf3">select id, name, weight from capivaras order by id;</text>
<text x="18" y="226" fill="#e6edf3"> id |   name   | weight</text>
<text x="18" y="246" fill="#8b949e">----+----------+--------</text>
<text x="18" y="266" fill="#e6edf3">  1 | Filó     |      0</text>
<text x="18" y="286" fill="#e6edf3">  2 | Bolota   |      0</text>
<text x="18" y="306" fill="#e6edf3">  4 | Padrão   |      0</text>
<text x="18" y="326" fill="#e6edf3"> 99 | Fantasma |      0</text>
<text x="18" y="346" fill="#e6edf3">(4 rows)</text>
<text x="18" y="386" fill="#8b949e">-- No COMMIT, no CHECKPOINT, no clean shutdown: the server is killed here.</text>
<text x="18" y="426" fill="#8b949e">## server killed with kill -9; a new one opens the same files</text>
<text x="18" y="446" fill="#e6edf3">recovered from the log: N records, N page changes replayed, N unfinished transactions rolled back</text>
<text x="18" y="466" fill="#8b949e">-- Second server process, same file. What was committed is there; the</text>
<text x="18" y="486" fill="#8b949e">-- transaction that was open when the server died is gone without a trace.</text>
<text x="18" y="506" fill="#e6edf3">select * from capivaras;</text>
<text x="18" y="526" fill="#e6edf3"> id |  name  | weight | wild</text>
<text x="18" y="546" fill="#8b949e">----+--------+--------+------</text>
<text x="18" y="566" fill="#e6edf3">  1 | Filó   |   48.5 | t</text>
<text x="18" y="586" fill="#e6edf3">  2 | Bolota |     61 | f</text>
<text x="18" y="606" fill="#e6edf3">  4 | Padrão |   45.5 | t</text>
<text x="18" y="626" fill="#e6edf3">(3 rows)</text>
</g>
</svg>
