<svg xmlns="http://www.w3.org/2000/svg" width="676" height="1010" viewBox="0 0 676 1010" role="img" aria-label="psql: one query, with memory to spare and with 64 kB">
<rect width="676" height="1010" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h656 a10 10 0 0 1 10 10v24 h-676 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="338" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: one query, with memory to spare and with 64 kB</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- What each step did. The hash table fitted in memory; the sort kept only</text>
<text x="18" y="86" fill="#8b949e">-- the three rows it was going to return.</text>
<text x="18" y="106" fill="#e6edf3">explain (analyze, costs off, timing off)</text>
<text x="18" y="126" fill="#e6edf3">select c.name, o.total from orders o join customer c on c.id = o.customer_id</text>
<text x="18" y="146" fill="#e6edf3">order by o.total desc, c.name limit 3;</text>
<text x="18" y="166" fill="#e6edf3">                                QUERY PLAN</text>
<text x="18" y="186" fill="#8b949e">---------------------------------------------------------------------------</text>
<text x="18" y="206" fill="#e6edf3"> Limit (actual rows=3 loops=1)</text>
<text x="18" y="226" fill="#e6edf3">   -&gt;  Sort (actual rows=3 loops=1)</text>
<text x="18" y="246" fill="#e6edf3">         Sort Key: o.total DESC, c.name</text>
<text x="18" y="266" fill="#e6edf3">         Sort Method: top-N heapsort  Memory: 1kB</text>
<text x="18" y="286" fill="#e6edf3">         -&gt;  Hash Join (actual rows=5120 loops=1)</text>
<text x="18" y="306" fill="#e6edf3">               Hash Cond: (c.id = o.customer_id)</text>
<text x="18" y="326" fill="#e6edf3">               -&gt;  Seq Scan on orders o (actual rows=6144 loops=1)</text>
<text x="18" y="346" fill="#e6edf3">               -&gt;  Hash (actual rows=3075 loops=1)</text>
<text x="18" y="366" fill="#e6edf3">                     Batches: 1  Memory Usage: 606kB</text>
<text x="18" y="386" fill="#e6edf3">                     -&gt;  Seq Scan on customer c (actual rows=3075 loops=1)</text>
<text x="18" y="406" fill="#e6edf3">(10 rows)</text>
<text x="18" y="446" fill="#8b949e">-- The same with almost no memory: the hash join is done in batches on disk</text>
<text x="18" y="466" fill="#8b949e">-- and the sort (now of everything) in runs that are merged.</text>
<text x="18" y="486" fill="#e6edf3">set work_mem = &#39;64kB&#39;;</text>
<text x="18" y="506" fill="#e6edf3">SET</text>
<text x="18" y="526" fill="#e6edf3">explain (analyze, costs off, timing off)</text>
<text x="18" y="546" fill="#e6edf3">select c.name, o.total from orders o join customer c on c.id = o.customer_id</text>
<text x="18" y="566" fill="#e6edf3">order by o.total desc, c.name;</text>
<text x="18" y="586" fill="#e6edf3">                             QUERY PLAN</text>
<text x="18" y="606" fill="#8b949e">---------------------------------------------------------------------</text>
<text x="18" y="626" fill="#e6edf3"> Sort (actual rows=5120 loops=1)</text>
<text x="18" y="646" fill="#e6edf3">   Sort Key: o.total DESC, c.name</text>
<text x="18" y="666" fill="#e6edf3">   Sort Method: external merge  Runs: 6</text>
<text x="18" y="686" fill="#e6edf3">   -&gt;  Hash Join (actual rows=5120 loops=1)</text>
<text x="18" y="706" fill="#e6edf3">         Hash Cond: (c.id = o.customer_id)</text>
<text x="18" y="726" fill="#e6edf3">         -&gt;  Seq Scan on orders o (actual rows=6144 loops=1)</text>
<text x="18" y="746" fill="#e6edf3">         -&gt;  Hash (actual rows=3075 loops=1)</text>
<text x="18" y="766" fill="#e6edf3">               Batches: 16  Memory Usage: 42kB</text>
<text x="18" y="786" fill="#e6edf3">               -&gt;  Seq Scan on customer c (actual rows=3075 loops=1)</text>
<text x="18" y="806" fill="#e6edf3">(9 rows)</text>
<text x="18" y="846" fill="#e6edf3">select c.name, o.total from orders o join customer c on c.id = o.customer_id</text>
<text x="18" y="866" fill="#e6edf3">order by o.total desc, c.name limit 3;</text>
<text x="18" y="886" fill="#e6edf3">     name     | total</text>
<text x="18" y="906" fill="#8b949e">--------------+-------</text>
<text x="18" y="926" fill="#e6edf3"> Caio         |    90</text>
<text x="18" y="946" fill="#e6edf3"> Cliente 1003 |    90</text>
<text x="18" y="966" fill="#e6edf3"> Cliente 1007 |    90</text>
<text x="18" y="986" fill="#e6edf3">(3 rows)</text>
</g>
</svg>
