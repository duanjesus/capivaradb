<svg xmlns="http://www.w3.org/2000/svg" width="609" height="550" viewBox="0 0 609 550" role="img" aria-label="psql: primary key, secondary index, sequential scan">
<rect width="609" height="550" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h589 a10 10 0 0 1 10 10v24 h-609 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="304" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: primary key, secondary index, sequential scan</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- The primary key finds one row without reading the table.</text>
<text x="18" y="86" fill="#e6edf3">explain select * from orders where id = 17;</text>
<text x="18" y="106" fill="#e6edf3">                         QUERY PLAN</text>
<text x="18" y="126" fill="#8b949e">------------------------------------------------------------</text>
<text x="18" y="146" fill="#e6edf3"> Index Scan using orders_pkey on orders  (cost=4.20 rows=1)</text>
<text x="18" y="166" fill="#e6edf3">   Index Cond: (id = 17)</text>
<text x="18" y="186" fill="#e6edf3">(2 rows)</text>
<text x="18" y="226" fill="#8b949e">-- A secondary index; the condition it cannot use stays as a filter.</text>
<text x="18" y="246" fill="#e6edf3">explain select * from orders where customer_id = 2 and total &gt; 40;</text>
<text x="18" y="266" fill="#e6edf3">                           QUERY PLAN</text>
<text x="18" y="286" fill="#8b949e">-----------------------------------------------------------------</text>
<text x="18" y="306" fill="#e6edf3"> Index Scan using orders_customer on orders  (cost=18.00 rows=2)</text>
<text x="18" y="326" fill="#e6edf3">   Index Cond: (customer_id = 2)</text>
<text x="18" y="346" fill="#e6edf3">   Filter: (total &gt; 40)</text>
<text x="18" y="366" fill="#e6edf3">(3 rows)</text>
<text x="18" y="406" fill="#8b949e">-- Nothing to go on: a sequential scan.</text>
<text x="18" y="426" fill="#e6edf3">explain select * from orders where total &gt; 40;</text>
<text x="18" y="446" fill="#e6edf3">                 QUERY PLAN</text>
<text x="18" y="466" fill="#8b949e">--------------------------------------------</text>
<text x="18" y="486" fill="#e6edf3"> Seq Scan on orders  (cost=480.00 rows=311)</text>
<text x="18" y="506" fill="#e6edf3">   Filter: (total &gt; 40)</text>
<text x="18" y="526" fill="#e6edf3">(2 rows)</text>
</g>
</svg>
