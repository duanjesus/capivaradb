<svg xmlns="http://www.w3.org/2000/svg" width="659" height="1210" viewBox="0 0 659 1210" role="img" aria-label="psql (PostgreSQL 17) connected to CapivaraDB">
<rect width="659" height="1210" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h639 a10 10 0 0 1 10 10v24 h-659 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="329" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql (PostgreSQL 17) connected to CapivaraDB</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#e6edf3">select version();</text>
<text x="18" y="86" fill="#e6edf3">                      version</text>
<text x="18" y="106" fill="#8b949e">----------------------------------------------------</text>
<text x="18" y="126" fill="#e6edf3"> CapivaraDB 0.1.0 (PostgreSQL 16.0 wire-compatible)</text>
<text x="18" y="146" fill="#e6edf3">(1 row)</text>
<text x="18" y="186" fill="#e6edf3">create table capivaras (</text>
<text x="18" y="206" fill="#e6edf3">    id      int primary key,</text>
<text x="18" y="226" fill="#e6edf3">    name    text not null,</text>
<text x="18" y="246" fill="#e6edf3">    weight  double precision,</text>
<text x="18" y="266" fill="#e6edf3">    wild    boolean</text>
<text x="18" y="286" fill="#e6edf3">);</text>
<text x="18" y="306" fill="#e6edf3">CREATE TABLE</text>
<text x="18" y="326" fill="#e6edf3">insert into capivaras values</text>
<text x="18" y="346" fill="#e6edf3">    (1, &#39;Filó&#39;,    48.5, true),</text>
<text x="18" y="366" fill="#e6edf3">    (2, &#39;Bolota&#39;,  61.0, false),</text>
<text x="18" y="386" fill="#e6edf3">    (3, &#39;Pingo&#39;,   null, true);</text>
<text x="18" y="406" fill="#e6edf3">INSERT 0 3</text>
<text x="18" y="426" fill="#e6edf3">select * from capivaras;</text>
<text x="18" y="446" fill="#e6edf3"> id |  name  | weight | wild</text>
<text x="18" y="466" fill="#8b949e">----+--------+--------+------</text>
<text x="18" y="486" fill="#e6edf3">  1 | Filó   |   48.5 | t</text>
<text x="18" y="506" fill="#e6edf3">  2 | Bolota |     61 | f</text>
<text x="18" y="526" fill="#e6edf3">  3 | Pingo  |        | t</text>
<text x="18" y="546" fill="#e6edf3">(3 rows)</text>
<text x="18" y="586" fill="#e6edf3">select name, weight * 2 as double_weight, weight is null as unknown_weight</text>
<text x="18" y="606" fill="#e6edf3">from capivaras</text>
<text x="18" y="626" fill="#e6edf3">where wild;</text>
<text x="18" y="646" fill="#e6edf3"> name  | double_weight | unknown_weight</text>
<text x="18" y="666" fill="#8b949e">-------+---------------+----------------</text>
<text x="18" y="686" fill="#e6edf3"> Filó  |            97 | f</text>
<text x="18" y="706" fill="#e6edf3"> Pingo |               | t</text>
<text x="18" y="726" fill="#e6edf3">(2 rows)</text>
<text x="18" y="766" fill="#8b949e">-- Several statements in one message, as psql sends them with \;</text>
<text x="18" y="786" fill="#e6edf3">select 1 as one \; select &#39;two&#39; as two;</text>
<text x="18" y="806" fill="#e6edf3"> one</text>
<text x="18" y="826" fill="#8b949e">-----</text>
<text x="18" y="846" fill="#e6edf3">   1</text>
<text x="18" y="866" fill="#e6edf3">(1 row)</text>
<text x="18" y="906" fill="#e6edf3"> two</text>
<text x="18" y="926" fill="#8b949e">-----</text>
<text x="18" y="946" fill="#e6edf3"> two</text>
<text x="18" y="966" fill="#e6edf3">(1 row)</text>
<text x="18" y="1006" fill="#e6edf3">update capivaras set weight = 35.2 where name = &#39;Pingo&#39;;</text>
<text x="18" y="1026" fill="#e6edf3">UPDATE 1</text>
<text x="18" y="1046" fill="#e6edf3">delete from capivaras where not wild;</text>
<text x="18" y="1066" fill="#e6edf3">DELETE 1</text>
<text x="18" y="1086" fill="#e6edf3">select id, name, weight from capivaras;</text>
<text x="18" y="1106" fill="#e6edf3"> id | name  | weight</text>
<text x="18" y="1126" fill="#8b949e">----+-------+--------</text>
<text x="18" y="1146" fill="#e6edf3">  1 | Filó  |   48.5</text>
<text x="18" y="1166" fill="#e6edf3">  3 | Pingo |   35.2</text>
<text x="18" y="1186" fill="#e6edf3">(2 rows)</text>
</g>
</svg>
