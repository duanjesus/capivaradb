<svg xmlns="http://www.w3.org/2000/svg" width="668" height="450" viewBox="0 0 668 450" role="img" aria-label="psql: a query that wants three rows reads three rows">
<rect width="668" height="450" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h648 a10 10 0 0 1 10 10v24 h-668 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="334" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: a query that wants three rows reads three rows</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- A query that wants three rows reads three rows.</text>
<text x="18" y="86" fill="#e6edf3">explain (analyze, costs off, timing off) select id from orders limit 3;</text>
<text x="18" y="106" fill="#e6edf3">                    QUERY PLAN</text>
<text x="18" y="126" fill="#8b949e">--------------------------------------------------</text>
<text x="18" y="146" fill="#e6edf3"> Limit (actual rows=3 loops=1)</text>
<text x="18" y="166" fill="#e6edf3">   -&gt;  Seq Scan on orders (actual rows=3 loops=1)</text>
<text x="18" y="186" fill="#e6edf3">(2 rows)</text>
<text x="18" y="226" fill="#8b949e">-- And the second half of a UNION ALL is not even started if the first half</text>
<text x="18" y="246" fill="#8b949e">-- was enough.</text>
<text x="18" y="266" fill="#e6edf3">explain (analyze, costs off, timing off)</text>
<text x="18" y="286" fill="#e6edf3">select id from orders union all select id from customer limit 3;</text>
<text x="18" y="306" fill="#e6edf3">                       QUERY PLAN</text>
<text x="18" y="326" fill="#8b949e">--------------------------------------------------------</text>
<text x="18" y="346" fill="#e6edf3"> Limit (actual rows=3 loops=1)</text>
<text x="18" y="366" fill="#e6edf3">   -&gt;  Append (actual rows=3 loops=1)</text>
<text x="18" y="386" fill="#e6edf3">         -&gt;  Seq Scan on orders (actual rows=3 loops=1)</text>
<text x="18" y="406" fill="#e6edf3">         -&gt;  Seq Scan on customer (never executed)</text>
<text x="18" y="426" fill="#e6edf3">(4 rows)</text>
</g>
</svg>
