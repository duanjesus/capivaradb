<svg xmlns="http://www.w3.org/2000/svg" width="777" height="730" viewBox="0 0 777 730" role="img" aria-label="psql: joins and aggregates">
<rect width="777" height="730" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h757 a10 10 0 0 1 10 10v24 h-777 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="388" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: joins and aggregates</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- Joins: inner drops Enzo, left keeps the empty department.</text>
<text x="18" y="86" fill="#e6edf3">select e.name, d.name as dept, b.name as boss</text>
<text x="18" y="106" fill="#e6edf3">from emp e</text>
<text x="18" y="126" fill="#e6edf3">join dept d on d.id = e.dept_id</text>
<text x="18" y="146" fill="#e6edf3">left join emp b on b.id = e.boss</text>
<text x="18" y="166" fill="#e6edf3">order by e.id;</text>
<text x="18" y="186" fill="#e6edf3"> name |    dept    | boss</text>
<text x="18" y="206" fill="#8b949e">------+------------+------</text>
<text x="18" y="226" fill="#e6edf3"> Ana  | engenharia |</text>
<text x="18" y="246" fill="#e6edf3"> Bia  | engenharia | Ana</text>
<text x="18" y="266" fill="#e6edf3"> Caio | operações  | Ana</text>
<text x="18" y="286" fill="#e6edf3"> Duda | operações  | Caio</text>
<text x="18" y="306" fill="#e6edf3"> Fabi | engenharia |</text>
<text x="18" y="326" fill="#e6edf3">(5 rows)</text>
<text x="18" y="366" fill="#e6edf3">select d.name, count(e.id) as people, sum(e.salary) as payroll, avg(e.salary) as average</text>
<text x="18" y="386" fill="#e6edf3">from dept d</text>
<text x="18" y="406" fill="#e6edf3">left join emp e on e.dept_id = d.id</text>
<text x="18" y="426" fill="#e6edf3">group by d.name</text>
<text x="18" y="446" fill="#e6edf3">order by people desc, d.name;</text>
<text x="18" y="466" fill="#e6edf3">    name    | people | payroll |      average</text>
<text x="18" y="486" fill="#8b949e">------------+--------+---------+-------------------</text>
<text x="18" y="506" fill="#e6edf3"> engenharia |      3 |     230 | 76.66666666666667</text>
<text x="18" y="526" fill="#e6edf3"> operações  |      2 |     120 |                60</text>
<text x="18" y="546" fill="#e6edf3"> vazio      |      0 |         |</text>
<text x="18" y="566" fill="#e6edf3">(3 rows)</text>
<text x="18" y="606" fill="#e6edf3">select dept_id, count(*) from emp group by dept_id having count(*) &gt; 1 order by 1;</text>
<text x="18" y="626" fill="#e6edf3"> dept_id | count</text>
<text x="18" y="646" fill="#8b949e">---------+-------</text>
<text x="18" y="666" fill="#e6edf3">       1 |     3</text>
<text x="18" y="686" fill="#e6edf3">       2 |     2</text>
<text x="18" y="706" fill="#e6edf3">(2 rows)</text>
</g>
</svg>
