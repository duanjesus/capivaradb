<svg xmlns="http://www.w3.org/2000/svg" width="794" height="670" viewBox="0 0 794 670" role="img" aria-label="psql: a hash join, and a merge join that needs no sort">
<rect width="794" height="670" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h774 a10 10 0 0 1 10 10v24 h-794 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="397" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: a hash join, and a merge join that needs no sort</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- No index on orders.customer_id: the customers are hashed and the orders</text>
<text x="18" y="86" fill="#8b949e">-- go past once.</text>
<text x="18" y="106" fill="#e6edf3">explain (costs off) select count(*) from orders o join customer c on c.id = o.customer_id;</text>
<text x="18" y="126" fill="#e6edf3">                QUERY PLAN</text>
<text x="18" y="146" fill="#8b949e">-------------------------------------------</text>
<text x="18" y="166" fill="#e6edf3"> Aggregate</text>
<text x="18" y="186" fill="#e6edf3">   -&gt;  Hash Join</text>
<text x="18" y="206" fill="#e6edf3">         Hash Cond: (c.id = o.customer_id)</text>
<text x="18" y="226" fill="#e6edf3">         -&gt;  Seq Scan on orders o</text>
<text x="18" y="246" fill="#e6edf3">         -&gt;  Hash</text>
<text x="18" y="266" fill="#e6edf3">               -&gt;  Seq Scan on customer c</text>
<text x="18" y="286" fill="#e6edf3">(6 rows)</text>
<text x="18" y="326" fill="#e6edf3">select count(*) from orders o join customer c on c.id = o.customer_id;</text>
<text x="18" y="346" fill="#e6edf3"> count</text>
<text x="18" y="366" fill="#8b949e">-------</text>
<text x="18" y="386" fill="#e6edf3">  5120</text>
<text x="18" y="406" fill="#e6edf3">(1 row)</text>
<text x="18" y="446" fill="#8b949e">-- Two tables joined on their primary keys are both already in key order:</text>
<text x="18" y="466" fill="#8b949e">-- a merge needs no hash table and no sort.</text>
<text x="18" y="486" fill="#e6edf3">explain (costs off) select count(*) from orders o join customer c on c.id = o.id;</text>
<text x="18" y="506" fill="#e6edf3">             QUERY PLAN</text>
<text x="18" y="526" fill="#8b949e">------------------------------------</text>
<text x="18" y="546" fill="#e6edf3"> Aggregate</text>
<text x="18" y="566" fill="#e6edf3">   -&gt;  Merge Join</text>
<text x="18" y="586" fill="#e6edf3">         Merge Cond: (c.id = o.id)</text>
<text x="18" y="606" fill="#e6edf3">         -&gt;  Seq Scan on orders o</text>
<text x="18" y="626" fill="#e6edf3">         -&gt;  Seq Scan on customer c</text>
<text x="18" y="646" fill="#e6edf3">(5 rows)</text>
</g>
</svg>
