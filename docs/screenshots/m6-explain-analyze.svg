<svg xmlns="http://www.w3.org/2000/svg" width="963" height="810" viewBox="0 0 963 810" role="img" aria-label="psql: EXPLAIN ANALYZE, and plans of UPDATE and DELETE">
<rect width="963" height="810" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h943 a10 10 0 0 1 10 10v24 h-963 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="481" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: EXPLAIN ANALYZE, and plans of UPDATE and DELETE</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- EXPLAIN ANALYZE runs the query and shows what each step really did.</text>
<text x="18" y="86" fill="#e6edf3">explain (analyze, timing off)</text>
<text x="18" y="106" fill="#e6edf3">select c.city, count(*), sum(o.total)</text>
<text x="18" y="126" fill="#e6edf3">from customer c left join orders o on o.customer_id = c.id</text>
<text x="18" y="146" fill="#e6edf3">where c.city = &#39;Recife&#39;</text>
<text x="18" y="166" fill="#e6edf3">group by c.city</text>
<text x="18" y="186" fill="#e6edf3">order by 2 desc;</text>
<text x="18" y="206" fill="#e6edf3">                                                  QUERY PLAN</text>
<text x="18" y="226" fill="#8b949e">--------------------------------------------------------------------------------------------------------------</text>
<text x="18" y="246" fill="#e6edf3"> Sort  (cost=901.26 rows=4) (actual rows=1 loops=1)</text>
<text x="18" y="266" fill="#e6edf3">   Sort Key: 2</text>
<text x="18" y="286" fill="#e6edf3">   -&gt;  HashAggregate  (cost=900.27 rows=4) (actual rows=1 loops=1)</text>
<text x="18" y="306" fill="#e6edf3">         Group Key: c.city</text>
<text x="18" y="326" fill="#e6edf3">         -&gt;  Nested Loop Left Join  (cost=896.00 rows=43) (actual rows=10 loops=1)</text>
<text x="18" y="346" fill="#e6edf3">               Join Filter: (o.customer_id = c.id)</text>
<text x="18" y="366" fill="#e6edf3">               -&gt;  Seq Scan on customer c  (cost=128.00 rows=43) (actual rows=2 loops=1)</text>
<text x="18" y="386" fill="#e6edf3">                     Filter: (c.city = &#39;Recife&#39;)</text>
<text x="18" y="406" fill="#e6edf3">               -&gt;  Index Scan using orders_customer on orders o  (cost=18.00 rows=4) (actual rows=10 loops=2)</text>
<text x="18" y="426" fill="#e6edf3">                     Index Cond: (o.customer_id = c.id)</text>
<text x="18" y="446" fill="#e6edf3">(10 rows)</text>
<text x="18" y="486" fill="#8b949e">-- Updates and deletes find their rows the same way.</text>
<text x="18" y="506" fill="#e6edf3">explain (costs off) update orders set total = total + 1 where id = 10;</text>
<text x="18" y="526" fill="#e6edf3">                  QUERY PLAN</text>
<text x="18" y="546" fill="#8b949e">----------------------------------------------</text>
<text x="18" y="566" fill="#e6edf3"> Update on orders</text>
<text x="18" y="586" fill="#e6edf3">   -&gt;  Index Scan using orders_pkey on orders</text>
<text x="18" y="606" fill="#e6edf3">         Index Cond: (id = 10)</text>
<text x="18" y="626" fill="#e6edf3">(3 rows)</text>
<text x="18" y="666" fill="#e6edf3">explain (costs off) delete from orders where customer_id = 2;</text>
<text x="18" y="686" fill="#e6edf3">                    QUERY PLAN</text>
<text x="18" y="706" fill="#8b949e">--------------------------------------------------</text>
<text x="18" y="726" fill="#e6edf3"> Delete on orders</text>
<text x="18" y="746" fill="#e6edf3">   -&gt;  Index Scan using orders_customer on orders</text>
<text x="18" y="766" fill="#e6edf3">         Index Cond: (customer_id = 2)</text>
<text x="18" y="786" fill="#e6edf3">(3 rows)</text>
</g>
</svg>
