<svg xmlns="http://www.w3.org/2000/svg" width="811" height="1110" viewBox="0 0 811 1110" role="img" aria-label="psql: GROUP BY, DISTINCT and EXCEPT with 64 kB of memory">
<rect width="811" height="1110" rx="10" fill="#0d1117"/>
<path d="M0 10a10 10 0 0 1 10-10h791 a10 10 0 0 1 10 10v24 h-811 z" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/>
<circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="405" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b949e">psql: GROUP BY, DISTINCT and EXCEPT with 64 kB of memory</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="18" y="66" fill="#8b949e">-- Grouping keeps one entry per group in a hash table. With room for all</text>
<text x="18" y="86" fill="#8b949e">-- 8 192 groups it is done in one pass...</text>
<text x="18" y="106" fill="#e6edf3">explain (analyze, costs off, timing off) select label, count(*) from item group by label;</text>
<text x="18" y="126" fill="#e6edf3">                    QUERY PLAN</text>
<text x="18" y="146" fill="#8b949e">---------------------------------------------------</text>
<text x="18" y="166" fill="#e6edf3"> HashAggregate (actual rows=8192 loops=1)</text>
<text x="18" y="186" fill="#e6edf3">   Group Key: label</text>
<text x="18" y="206" fill="#e6edf3">   Batches: 1  Memory Usage: 1782kB</text>
<text x="18" y="226" fill="#e6edf3">   -&gt;  Seq Scan on item (actual rows=8192 loops=1)</text>
<text x="18" y="246" fill="#e6edf3">(4 rows)</text>
<text x="18" y="286" fill="#8b949e">-- ...and without, the groups that do not fit are set aside on disk and</text>
<text x="18" y="306" fill="#8b949e">-- grouped in later passes.</text>
<text x="18" y="326" fill="#e6edf3">set work_mem = &#39;64kB&#39;;</text>
<text x="18" y="346" fill="#e6edf3">SET</text>
<text x="18" y="366" fill="#e6edf3">explain (analyze, costs off, timing off) select label, count(*) from item group by label;</text>
<text x="18" y="386" fill="#e6edf3">                    QUERY PLAN</text>
<text x="18" y="406" fill="#8b949e">---------------------------------------------------</text>
<text x="18" y="426" fill="#e6edf3"> HashAggregate (actual rows=8192 loops=1)</text>
<text x="18" y="446" fill="#e6edf3">   Group Key: label</text>
<text x="18" y="466" fill="#e6edf3">   Batches: 49  Memory Usage: 65kB</text>
<text x="18" y="486" fill="#e6edf3">   -&gt;  Seq Scan on item (actual rows=8192 loops=1)</text>
<text x="18" y="506" fill="#e6edf3">(4 rows)</text>
<text x="18" y="546" fill="#e6edf3">select count(*), sum(n) from (select label, count(*) as n from item group by label) g;</text>
<text x="18" y="566" fill="#e6edf3"> count | sum</text>
<text x="18" y="586" fill="#8b949e">-------+------</text>
<text x="18" y="606" fill="#e6edf3">  8192 | 8192</text>
<text x="18" y="626" fill="#e6edf3">(1 row)</text>
<text x="18" y="666" fill="#e6edf3">explain (analyze, costs off, timing off) select distinct label from item;</text>
<text x="18" y="686" fill="#e6edf3">                    QUERY PLAN</text>
<text x="18" y="706" fill="#8b949e">---------------------------------------------------</text>
<text x="18" y="726" fill="#e6edf3"> Unique (actual rows=8192 loops=1)</text>
<text x="18" y="746" fill="#e6edf3">   Batches: 17  Memory Usage: 65kB</text>
<text x="18" y="766" fill="#e6edf3">   -&gt;  Seq Scan on item (actual rows=8192 loops=1)</text>
<text x="18" y="786" fill="#e6edf3">(3 rows)</text>
<text x="18" y="826" fill="#e6edf3">explain (analyze, costs off, timing off) select id from item except select id + 1 from item;</text>
<text x="18" y="846" fill="#e6edf3">                    QUERY PLAN</text>
<text x="18" y="866" fill="#8b949e">---------------------------------------------------</text>
<text x="18" y="886" fill="#e6edf3"> HashSetOp Except (actual rows=1 loops=1)</text>
<text x="18" y="906" fill="#e6edf3">   Batches: 17  Memory Usage: 65kB</text>
<text x="18" y="926" fill="#e6edf3">   -&gt;  Seq Scan on item (actual rows=8192 loops=1)</text>
<text x="18" y="946" fill="#e6edf3">   -&gt;  Seq Scan on item (actual rows=8192 loops=1)</text>
<text x="18" y="966" fill="#e6edf3">(4 rows)</text>
<text x="18" y="1006" fill="#e6edf3">select id from item except select id + 1 from item;</text>
<text x="18" y="1026" fill="#e6edf3"> id</text>
<text x="18" y="1046" fill="#8b949e">----</text>
<text x="18" y="1066" fill="#e6edf3">  1</text>
<text x="18" y="1086" fill="#e6edf3">(1 row)</text>
</g>
</svg>
